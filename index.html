<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Sierpinski Carpet WebGL</title>

  <!-- 셰이더 -->
  <script id="vertex-shader" type="x-shader/x-vertex">
    attribute vec4 vPosition;
    attribute vec4 vColor;
    varying vec4 fColor;
    void main() {
      gl_Position = vPosition;
      fColor = vColor;
    }
  </script>

  <script id="fragment-shader" type="x-shader/x-fragment">
    precision mediump float;
    varying vec4 fColor;
    void main() {
      gl_FragColor = fColor;
    }
  </script>

  <script src="initShaders.js"></script>
  <script src="MV.js"></script>
  <script src="main.js" defer></script>
</head>
<body>
  <label>Depth: <input type="range" id="depth" min="1" max="6" value="3"></label>
  <label>Color: <input type="color" id="color" value="#0000ff"></label>
  <canvas id="glCanvas" width="600" height="600"></canvas>
</body>
</html>
